name: Publish the phone app

# Publishes the phone-only app to GitHub Pages (https://<owner>.github.io/<repository>/) once CI has passed on main,
# from the commit CI tested; it can also be run by hand. One-time setup: Settings → Pages → Source: "GitHub Actions".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a deploy in progress is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the phone app
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The type check still covers the Pi's API routes, which use the Prisma client.
      - run: npx prisma generate
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build:pages
        env:
          # The path Pages serves this repository under, such as /rc-lap-timer (empty for a custom domain).
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Accounts, cloud sync, shared tracks and leaderboards: only when these repository variables name a Supabase
          # project (Settings → Secrets and variables → Actions → Variables; docs/cloud.md). Unset, the app has none of it.
          NEXT_PUBLIC_CLOUD_URL: ${{ vars.CLOUD_URL }}
          NEXT_PUBLIC_CLOUD_KEY: ${{ vars.CLOUD_KEY }}
          NEXT_PUBLIC_CLOUD_PRIVACY_URL: ${{ vars.CLOUD_PRIVACY_URL }}
      - run: node scripts/check-bundles.mjs ${{ vars.CLOUD_URL && 'standalone-cloud' || 'standalone' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Publish it
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

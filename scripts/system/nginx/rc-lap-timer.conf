# RC Lap Timer's web server settings on the Pi: /etc/nginx/sites-available/rc-lap-timer.
# scripts/system/piUpgrade2.sh installs this file (keeping the old one as rc-lap-timer.bak), so changes made on the
# Pi are replaced at the next upgrade: make them here instead.

# Plain HTTP moves to HTTPS, except the sync routes and the certificate authority. The phone app (served from GitHub
# Pages) calls the sync routes over plain HTTP from Chrome, which allows that to a local address once the user allows
# local network access; phones download the certificate authority before they trust the timer's HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rc-lap-timer rc-lap-timer.local 192.168.4.1;

    location /api/sync {
        # A phone's whole backup, and time for a Pi Zero to merge it.
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The timer's certificate authority, for phones to install once so they trust the timer (see the README).
    location = /rc-lap-timer-ca.crt {
        alias /etc/ssl/certs/rc-lap-timer-ca.crt;
        types { }
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name rc-lap-timer rc-lap-timer.local 192.168.4.1;

    # Made on the timer by scripts/system/rc-tls.sh.
    ssl_certificate /etc/ssl/certs/rc-lap-timer.crt;
    ssl_certificate_key /etc/ssl/private/rc-lap-timer.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # The timer's certificate authority, for phones to install once so they trust the timer (see the README).
    location = /rc-lap-timer-ca.crt {
        alias /etc/ssl/certs/rc-lap-timer-ca.crt;
        types { }
        default_type application/x-x509-ca-cert;
    }

    # The app doesn't use Next.js image optimization; blocking it closes a class of Next.js advisories.
    location /_next/image {
        return 404;
    }

    # Backups restored on the timer, and sync from phones that trust the timer's certificate.
    location /api/sync {
        client_max_body_size 50m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app. No WebSocket upgrade headers are forwarded: the app doesn't use them, and forwarding them exposes
    # Next.js 14 to advisories that have no 14.x fix.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The IR detector's API.
    location /api/ir/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
